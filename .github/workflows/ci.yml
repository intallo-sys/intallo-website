name: CI - Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint code
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js application for production
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/intallo?schema=public' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_dummy_ci_key' }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET || 'ci_ip_hash_secret_value' }}
          CONTACT_FROM_EMAIL: "onboarding@resend.dev"
          CONTACT_RECIPIENT_EMAIL: "hello@intallo.com"
          NEXT_TELEMETRY_DISABLED: "1"
